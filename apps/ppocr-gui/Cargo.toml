[package]
name = "ppocr-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "ppocr-gui"

[[bin]]
name = "ppocr-gui"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_5"] }
async-channel = "2.5"
dirs = "6.0"
gdk-pixbuf = "0.22.0"
gtk = { package = "gtk4", version = "=0.11.3", features = ["v4_14"] }
pangocairo = "=0.22.9"
ppocr-app-protocol = { path = "../../crates/ppocr-app-protocol" }
ppocr-i18n = { path = "../../crates/ppocr-i18n" }
ppocr-screenshot = { path = "../../crates/ppocr-screenshot" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"
