name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-cpu:
    name: Linux CPU
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 90

    steps:
      - name: Install system dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          actionlint clang cmake gettext git gstreamer gst-plugins-base-libs
          gtk4 gtk4-layer-shell libadwaita pkgconf rustup shellcheck

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.92.0 --component clippy,rustfmt
          rustup default 1.92.0

      - name: Validate workflows and scripts
        run: |
          actionlint
          shellcheck scripts/*.sh packaging/*.sh po/*.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build and verify the CPU release archive
        run: |
          ./scripts/package-release.sh \
            --backend cpu \
            --target x86_64-unknown-linux-gnu
          ./scripts/verify-release.sh dist/*.tar.gz
