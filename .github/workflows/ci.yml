name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux-cpu:
    name: Linux CPU
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            gettext \
            git \
            gstreamer1.0-gl \
            gstreamer1.0-pipewire \
            gstreamer1.0-plugins-base \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            locales \
            pkg-config \
            shellcheck \
            xz-utils
          sudo locale-gen en_US.UTF-8 zh_CN.UTF-8

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore gettext cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/ppocr-rs/gettext-1.0
          key: gettext-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-gettext.sh') }}

      - name: Install Rust-aware gettext extractor
        run: |
          gettext_prefix="$RUNNER_TOOL_CACHE/ppocr-rs/gettext-1.0"
          ./scripts/install-gettext.sh "$gettext_prefix"
          printf '%s/bin\n' "$gettext_prefix" >> "$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.92.0 --component clippy,rustfmt
          rustup default 1.92.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
          shared-key: x86_64-unknown-linux-gnu-cpu

      - name: Install actionlint
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            /tmp/actionlint.tar.gz | sha256sum --check
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          sudo install --mode 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Validate workflows and scripts
        run: |
          actionlint
          shellcheck scripts/*.sh packaging/*.sh po/*.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build and verify the CPU release archive
        run: |
          ./scripts/package-release.sh \
            --backend cpu \
            --target x86_64-unknown-linux-gnu
          ./scripts/verify-release.sh dist/*.tar.gz
