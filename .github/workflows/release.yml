name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }} / ${{ matrix.backend }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            backend: cpu
            artifact: ppocr-rs-linux-x86_64-cpu

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            gettext \
            git \
            gstreamer1.0-gl \
            gstreamer1.0-pipewire \
            gstreamer1.0-plugins-base \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            locales \
            pkg-config \
            xz-utils
          sudo locale-gen en_US.UTF-8 zh_CN.UTF-8

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust-aware gettext extractor
        run: |
          ./scripts/install-gettext.sh "$RUNNER_TEMP/gettext"
          printf '%s\n' "$RUNNER_TEMP/gettext/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.92.0 --component clippy,rustfmt
          rustup default 1.92.0

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
          shared-key: ${{ matrix.target }}-${{ matrix.backend }}

      - name: Test the release source
        run: cargo test --workspace --all-targets --locked

      - name: Build and verify the CPU release archive
        shell: bash
        run: |
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version_args=(--version "${GITHUB_REF_NAME#v}")
          fi
          ./scripts/package-release.sh \
            --backend "${{ matrix.backend }}" \
            --target "${{ matrix.target }}" \
            "${version_args[@]}"
          ./scripts/verify-release.sh dist/*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ppocr-rs-*
          path: dist
          merge-multiple: true

      - name: Verify archive checksums
        run: cd dist && sha256sum --check -- *.sha256

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "ppocr-rs $RELEASE_TAG"
          fi
