[package]
name = "ppocr-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "A Rust implementation of the PaddleOCR general OCR pipeline"

[lib]
name = "ppocr"
path = "src/lib.rs"

[dependencies]
dirs = "6.0"
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"
