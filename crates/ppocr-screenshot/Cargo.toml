[package]
name = "ppocr-screenshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "ppocr-screencopy"
path = "src/bin/ppocr-screencopy.rs"

[dependencies]
async-channel = "2.5"
gdk-pixbuf = "0.22.0"
gtk = { package = "gtk4", version = "=0.11.3", features = ["v4_14"] }
image = { version = "0.25.8", default-features = false, features = ["png"] }
ppocr-i18n = { path = "../ppocr-i18n" }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "screencast"] }
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
gstreamer-gl = { version = "=0.25.4", features = ["v1_28"] }
gstreamer-video = "=0.25.4"
gtk4-layer-shell = "=0.8.1"
libwayshot = { version = "=0.9.0", default-features = false, features = ["png"] }
